substitutions:
  # --- 基础设备配置 ---
  dev_name: "daikin-air-sensor"   # 设备名称 (多台设备可在此更改设备名)
  pm_sensor_type: "pm2105"        # 选填pm2005(银色版本)或pm2105(黑色版本)
  fw_version: "v2.6"              # 固件版本号

  # --- 显示屏硬件配置 ---
  display_model: "SH1106 128x64"  # SSD1306 128x64(0.96/2.42英寸含SSD1309)/SH1106 128x64(1.3英寸)/SH1107 128x128(1.5英寸，未测试)
  display_address: "0x3C"         # 不亮可改为0x3D/0x3C

  # --- 传感器与系统底层轮询频率 (不可在前端更改的静态配置) ---
  pm_update_interval: "10s"       # I2C 总线拉取数据的频率，保持10s即可
  sntp_update_interval: "60min"   # 网络时间同步频率。UDP对讲极省资源，无需在前端调整

esphome:
  name: ${dev_name}
  project:
    name: "DAIKIN.BRY88AB151K"
    version: "${pm_sensor_type}-${fw_version}"
  name_add_mac_suffix: true

  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 开机直接读取安全恢复出来的数字索引，反向灌回给 select 组件的 UI
          int idx = id(animation_style_idx);
          if (idx >= 0 && idx <= 6) {
            auto &options = id(animation_style).traits.get_options(); 
            id(animation_style).publish_state(options[idx]);
          }
      - if:
          condition:
            lambda: 'return id(screen_switch).state;' # 检查屏幕开关现在是不是开着的
          then:
            - script.execute: carousel_loop
            - script.execute: weather_auto_poll_task
      # 根据断电恢复的模式，决定启动哪种PM2.5传感器策略
      - if:
          condition:
            lambda: 'return id(pm_control_mode).current_option() == "Interval Poll";'
          then:
            - script.execute: pm_interval_script
      - if:
          condition:
            lambda: 'return id(pm_control_mode).current_option() == "Continuous";'
          then:
            - script.execute: pm_hw_on
      - if:
          condition:
            lambda: 'return id(pm_control_mode).current_option() == "Off" || id(pm_control_mode).current_option() == "Single Poll";'
          then:
            # 如果断电前是关闭或刚好在单次刷新，开机一律保持关闭状态
            - script.execute: pm_hw_off
            - select.set:
                id: pm_control_mode
                option: "Off"
      # 应用屏幕亮度
      - delay: 2s # 等待网络和屏幕完全就绪
      - lambda: 'id(oled_display).set_contrast(id(oled_brightness).state / 100.0);'

http_request:
  timeout: 3s
  verify_ssl: false

globals:
  - id: current_page_id
    type: int
    initial_value: '0'         # 0:时间, 1:天气, 2:温度, 3:湿度, 4:PM2.5, 5:CO2, 6:TVOC, 98:WiFi
  - id: next_page_id
    type: int
    initial_value: '0'
  - id: scroll_offset
    type: int
    initial_value: '0'         # 动画滚动的像素偏移量 (0 到 100)
  - id: is_animating
    type: bool
    initial_value: 'false'     # 是否正在播放动画
  - id: weather_temp
    type: float
    initial_value: '0.0'
  - id: weather_hum
    type: float
    initial_value: '0.0'
  - id: weather_desc
    type: std::string
    initial_value: '"Wait..."' # 默认显示等待获取
  - id: weather_retry_count    # 用于记录天气抓取重试次数的变量
    type: int
    initial_value: '0'
  - id: weather_icon
    type: std::string
    initial_value: '")"'       # 默认改为 N/A 图标
  - id: weather_is_err         # 天气错误标志位
    type: bool
    initial_value: 'false'
  - id: animation_style_idx    # 用于高效存储动画效果的数字索引，避免高频创建字符串
    type: int
    restore_value: true
    initial_value: '1'         # 重启恢复模式，默认初始值为 1
  - id: dino_state
    type: int
    initial_value: '0'         # 0: 未激活, 1: 游玩中, 2: 游戏结束画面
  - id: dino_y                 # 恐龙的高度坐标
    type: float
    initial_value: '50.0'
  - id: dino_v                 # 恐龙的跳跃速度
    type: float
    initial_value: '0.0'
  - id: cactus_x               # 障碍物(仙人掌)的水平坐标
    type: float
    initial_value: '128.0'
  - id: dino_score             # 当前分数
    type: int
    initial_value: '0'
  - id: dino_high_score        # 历史最高分 (保存在闪存中)
    type: int
    restore_value: true
    initial_value: '0'
  - id: dino_click_count       # 记录连续按键次数
    type: int
    initial_value: '0'
  - id: obs_type               # 记录当前生成的障碍物类型
    type: int
    initial_value: '0'
  - id: cactus2_x              # 2号障碍物的水平坐标
    type: float
    initial_value: '300.0'     # 初始位置
  - id: obs2_type              # 2号障碍物的类型
    type: int
    initial_value: '0'

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

wifi:
  networks:
  - ssid: 'WiFi-a' # 在此填写WiFi账号密码可免配网自动连接
    password: 'passworda'
  #   bssid: AA:AA:AA:AA:AA:AA  # Mesh网络可键入MAC地址设置主次路由连接优先级
  #   priority: 1               # 最高优先级
  # - ssid: "WiFi-b"            # 配置Mesh网络时请设置为WiFi-a输入的相同WiFi名
  #   password: "passwordb"
  #   bssid: BB:BB:BB:BB:BB:BB
  #   priority: 2
  # - ssid: "WiFi-c"
  #   password: "passwordc"
  #   bssid: CC:CC:CC:CC:CC:CC
  #   priority: 3
  ap:
    ssid: "DAIKIN Fallback Hotspot"
  # --- 连上 WiFi 后的触发更新天气 ---
  on_connect:
    then:
      - script.stop: carousel_loop     # 掐断正在运行的日常轮播（防止中途切页）
      - lambda: |-
          id(next_page_id) = 98;        // 将下一页指向 WiFi 页面 (ID 为 98)
          id(is_animating) = true;     // 开启切屏动画特效
      - delay: 5s # 连上 WiFi 后先等待 5 秒（让网络彻底稳定）且显示WiFi信息 5 秒钟
      - script.execute: fetch_weather  # 自动执行一次天气抓取脚本
      - script.execute: carousel_loop  # 5秒结束后，重新启动日常轮播，恢复正常

  # 如发现经常掉线可尝试以下方法：

  # 优化点 1：禁用 Wi-Fi 节能模式
  # power_save_mode: NONE
  
  # 优化点 2：开启快速连接（因为你已经指定了 BSSID，开启此项可跳过扫描直接连接，极大地提升重连速度）
  # fast_connect: true 

  # 优化点 3：建议配置静态 IP（根据你的路由器网段自行修改）
  # 很多时候在 HA 中显示“掉线”，其实是 mDNS 局域网广播未响应导致的 API 断开，固定 IP 能直接绕过这个问题。
  # manual_ip:
  #   static_ip: 192.168.2.201
  #   gateway: 192.168.2.1
  #   subnet: 255.255.255.0
  #   dns1: 223.5.5.5
  #   dns2: 1.1.1.1

captive_portal:

api:
  reboot_timeout: 0s

ota:
  platform: esphome
  
web_server:
  port: 80

logger:
  # level: DEBUG      # 临时调试时可将日志级别打开到 DEBUG
  logs:
    hdc1080: WARN
    sgp30: WARN
    sensor: WARN
    component: ERROR  # 注释掉后可查看网络组件的详细报错

uart:
  - id: cm1106_uart
    rx_pin: 16
    tx_pin: 17
    baud_rate: 9600

i2c:
  - id: pm_i2c
    sda: 23
    scl: 22
    scan: true
  - id: hmi_i2c
    sda: 19
    scl: 21
    frequency: 400kHz  # i2c通讯速率，用于屏幕刷新 (默认通常只有 50k 或 100k)
    scan: true

sensor:
  - platform: cm1106
    id: cm1106_sensor
    uart_id: cm1106_uart
    update_interval: 10s
    co2:
      name: "CO2 Sensor"
      id: co2_val

  - platform: pm2005
    i2c_id: pm_i2c
    type: ${pm_sensor_type}
    update_interval: 10s
    pm_1_0:
      name: "PM1.0 Sensor"
      id: pm10_val
    pm_2_5:
      name: "PM2.5 Sensor"
      id: pm25_val
    pm_10_0:
      name: "PM10 Sensor"
      id: pm100_val

  - platform: sgp30
    i2c_id: hmi_i2c
    store_baseline: true  # 利用 ESP32 闪存保存校准数据
    compensation:
      temperature_source: temp_val
      humidity_source: hum_val
    eco2:
      name: "SGP30 eCO2"
      id: eco2_val
      # internal: true    # 删除注释后可在后台隐藏
    tvoc:
      name: "TVOC Sensor"
      id: tvoc_val
      unit_of_measurement: "µg/m³"
      filters:
        - throttle: 15s
        - lambda: |-
            float scaled = x * id(tvoc_gain).state;
            return std::min(scaled, id(tvoc_max).state);
            
    eco2_baseline:  # eCO2基线数据 可整段注释隐藏
      name: "[DEBUG]SGP30 eCO2 Baseline"
      entity_category: "diagnostic"
    tvoc_baseline:  # TVOC基线数据 可整段注释隐藏
      name: "[DEBUG]SGP30 TVOC Baseline"
      entity_category: "diagnostic"

  - platform: hdc1080
    i2c_id: hmi_i2c
    update_interval: 15s
    temperature:
      name: "Temperature Sensor"
      id: temp_val
      filters:
        - offset: !lambda 'return -id(temp_offset).state;'
    humidity:
      name: "Humidity Sensor"
      id: hum_val
      filters:
        - multiply: !lambda 'return id(hum_gain).state;'
        - clamp:
            max_value: 100

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi_val   # 供屏幕读取的信号强度 ID
    entity_category: "diagnostic"
    
  - platform: template  # 剩余内存，可整段注释隐藏
    name: "[DEBUG]Free Heap"
    id: free_heap
    entity_category: "diagnostic"
    lambda: return xPortGetFreeHeapSize();
    update_interval: 60s
    unit_of_measurement: "B"
    
  - platform: uptime    # 运行时长，可整段注释隐藏
    name: "[DEBUG]Uptime"
    id: uptime_sec
    entity_category: "diagnostic"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip_str   # 供屏幕读取的 IP 地址 ID
      entity_category: "diagnostic"
  - platform: template
    name: "Firmware Version"
    icon: "mdi:tag-text-outline"
    update_interval: 60min
    entity_category: "diagnostic"
    lambda: |-
      return std::string("${pm_sensor_type}-${fw_version}");

switch:
  - platform: template
    name: "Alert LEDs"
    restore_mode: RESTORE_DEFAULT_ON # 默认通电亮灯，需要默认关请替换成：RESTORE_DEFAULT_OFF
    icon: mdi:led-off
    id: led_master
    optimistic: true
  - platform: gpio
    pin: 4
    id: co2_warn_led
    internal: true
  - platform: gpio
    pin: 32
    id: tvocch2o_warn_led
    internal: true
  - platform: gpio
    pin: 33
    id: pm25_warn_led
    internal: true
  - platform: template
    name: "OLED Screen"
    icon: mdi:monitor
    id: screen_switch
    restore_mode: RESTORE_DEFAULT_ON # 默认通电亮屏
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - lambda: |-
          id(oled_display).turn_on();
          // 开屏时立即应用当前设置的亮度
          id(oled_display).set_contrast(id(oled_brightness).state / 100.0);
      # 亮屏时恢复脚本运行
      - script.execute: carousel_loop
      - script.execute: weather_auto_poll_task
      - script.execute: fetch_weather # 唤醒时，立即强制更新一次最新的天气
    turn_off_action:
      - lambda: id(oled_display).turn_off();
      # 息屏时停止脚本，节约资源
      - script.stop: carousel_loop
      - script.stop: weather_auto_poll_task
  - platform: template
    name: "Screen Schedule" # 屏幕定时开关
    id: screen_schedule
    icon: mdi:calendar-clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF # 默认不开启定时
    entity_category: "config"
  - platform: template
    name: "[DEBUG] Dino Jump Switch"
    id: virtual_dino_jump_switch
    internal: true # 注释此行开启调试
    entity_category: "diagnostic"
    icon: "mdi:controller"
    turn_on_action:
      # 开关打开时起跳
      - lambda: |-
          if (id(dino_state) == 1 && id(dino_y) >= 50.0) { 
            id(dino_v) = -8.0; // 初始起跳力度-8.0，负值越大跳能跳得更高
          }
    turn_off_action:
      # 开关关闭时触发短跳逻辑
      - lambda: |-
          if (id(dino_state) == 1 && id(dino_v) < -2.0) {
            id(dino_v) = -2.0; // 如果还在往上升，立刻削弱向上的冲力，实现快速回落
          }

status_led:
  pin: 25

select:
  - platform: template
    name: "Screen Transition Effect"
    id: animation_style
    icon: "mdi:transition"
    optimistic: true
    restore_value: true
    initial_option: "Fade Effect"
    entity_category: "config"
    options:
      - "None"                # 无特效
      - "Fade Effect"         # 淡出淡入
      - "Wipe Right to Left"  # 从右到左擦除
      - "Wipe Left to Right"  # 从左到右擦除
      - "Wipe Top to Bottom"  # 从上到下擦除
      - "Wipe Bottom to Top"  # 从下到上擦除
      - "Blinds Effect"       # 百叶窗效果
    on_value:
      then:
        - lambda: |-
            id(animation_style_idx) = i;
            ESP_LOGD("custom", "Animation style updated to index: %d", i);
  - platform: template
    name: "Page 1 Content"
    id: page_1_content
    optimistic: true
    options: ["Time", "Weather", "Temperature", "Humidity", "PM2.5", "CO2", "TVOC", "WiFi", "Skip"]
    initial_option: "Time"         # 第一屏默认时间
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "Page 2 Content"
    id: page_2_content
    optimistic: true
    options: ["Time", "Weather", "Temperature", "Humidity", "PM2.5", "CO2", "TVOC", "WiFi", "Skip"]
    initial_option: "Weather"      # 第二屏默认天气
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "Page 3 Content"
    id: page_3_content
    optimistic: true
    options: ["Time", "Weather", "Temperature", "Humidity", "PM2.5", "CO2", "TVOC", "WiFi", "Skip"]
    initial_option: "Temperature"  # 第三屏默认温度
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "Page 4 Content"
    id: page_4_content
    optimistic: true
    options: ["Time", "Weather", "Temperature", "Humidity", "PM2.5", "CO2", "TVOC", "WiFi", "Skip"]
    initial_option: "Humidity"     # 第四屏默认湿度
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "Page 5 Content"
    id: page_5_content
    optimistic: true
    options: ["Time", "Weather", "Temperature", "Humidity", "PM2.5", "CO2", "TVOC", "WiFi", "Skip"]
    initial_option: "PM2.5"        # 第五屏默认PM2.5
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "Page 6 Content"
    id: page_6_content
    optimistic: true
    options: ["Time", "Weather", "Temperature", "Humidity", "PM2.5", "CO2", "TVOC", "WiFi", "Skip"]
    initial_option: "CO2"          # 第六屏默认CO2
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "Page 7 Content"
    id: page_7_content
    optimistic: true
    options: ["Time", "Weather", "Temperature", "Humidity", "PM2.5", "CO2", "TVOC", "WiFi", "Skip"]
    initial_option: "TVOC"         # 第七屏默认TVOC
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "Page 8 Content"
    id: page_8_content
    optimistic: true
    options: ["Time", "Weather", "Temperature", "Humidity", "PM2.5", "CO2", "TVOC", "WiFi", "Info", "Skip"]
    initial_option: "Skip"        # 默认 Skip, WiFi信息不加入日常轮播
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "PM Sensor Mode"
    id: pm_control_mode
    icon: "mdi:cog"
    options:
      - "Interval Poll"  # 定时刷新
      - "Continuous"     # 持续监测
      - "Single Poll"    # 单次刷新
      - "Off"            # 关闭
    initial_option: "Interval Poll"
    optimistic: true
    restore_value: true
    entity_category: "config"
    set_action:
      then:
        # 一旦模式切换，立刻强制停止所有正在运行的临时/循环任务
        - script.stop: pm_interval_script
        - script.stop: pm_single_script
        
        # 根据用户的选择，分流执行不同动作
        - if:
            condition:
              lambda: 'return x == "Continuous";'
            then:
              - script.execute: pm_hw_on
        - if:
            condition:
              lambda: 'return x == "Off";'
            then:
              - script.execute: pm_hw_off
        - if:
            condition:
              lambda: 'return x == "Single Poll";'
            then:
              - script.execute: pm_single_script
        - if:
            condition:
              lambda: 'return x == "Interval Poll";'
            then:
              - script.execute: pm_interval_script

number:
  - platform: template
    name: "CO2 Alert Limit"
    entity_category: "config"
    id: co2_alert_limit
    optimistic: true
    unit_of_measurement: "ppm"
    min_value: 400
    max_value: 5000
    step: 50
    initial_value: 1000
    mode: box
    restore_value: true
  - platform: template
    name: "PM2.5 Alert Limit"
    entity_category: "config"
    id: pm25_alert_limit
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 0
    max_value: 250
    step: 1
    initial_value: 50
    mode: box
    restore_value: true
  - platform: template
    name: "TVOC Alert Limit"
    entity_category: "config"
    id: tvoc_alert_limit
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 0
    max_value: 20000
    step: 100
    initial_value: 1000
    mode: box
    restore_value: true
  - platform: template
    name: "TVOC Maximum Displayed"
    entity_category: "config"
    id: tvoc_max
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 5000
    max_value: 20000
    step: 1000
    initial_value: 9000
    mode: box
    restore_value: true
  - platform: template
    name: "TVOC Gain"
    entity_category: "config"
    id: tvoc_gain
    optimistic: true
    min_value: 1
    max_value: 5
    step: 0.1
    initial_value: 3
    mode: box
    restore_value: true
  - platform: template
    name: "Humidity Gain"
    entity_category: "config"
    id: hum_gain
    optimistic: true
    min_value: 1
    max_value: 1.6
    step: 0.01
    initial_value: 1.13
    mode: box
    restore_value: true
  - platform: template
    name: "Temperature Offset"
    entity_category: "config"
    id: temp_offset
    optimistic: true
    min_value: 0
    max_value: 10
    step: 0.1
    initial_value: 4.5
    mode: box
    restore_value: true
  - platform: template
    name: "Weather Latitude"
    entity_category: "config"
    id: weather_lat
    optimistic: true
    min_value: -90.0
    max_value: 90.0
    step: 0.01
    initial_value: 39.90  # 默认纬度
    mode: box
    restore_value: true
  - platform: template
    name: "Weather Longitude"
    entity_category: "config"
    id: weather_lon
    optimistic: true
    min_value: -180.0
    max_value: 180.0
    step: 0.01
    initial_value: 116.39 # 默认经度
    mode: box
    restore_value: true
  - platform: template
    name: "PM Poll Interval"
    id: pm_poll_interval
    optimistic: true
    unit_of_measurement: "min"
    min_value: 3
    max_value: 60
    step: 1
    initial_value: 10     # 默认PM2.5每10分钟抓取一次
    mode: box
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "Weather Refresh Interval"
    id: weather_refresh_interval
    optimistic: true
    unit_of_measurement: "min"
    min_value: 5
    max_value: 120
    step: 1
    initial_value: 15     # 默认每15分钟抓取一次天气
    mode: box
    restore_value: true
    entity_category: "config"
  - platform: template
    name: "Page 1 Duration"
    id: page_1_duration
    optimistic: true
    min_value: 1
    max_value: 120
    step: 1
