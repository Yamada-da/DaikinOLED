  # 获取天气的错误处理与重试脚本
  - id: handle_weather_error
    mode: restart
    parameters:
      http_code: int
    then:
      - lambda: |-
          int current_retry = id(weather_retry_count);
          if (current_retry < 2) {
            id(weather_retry_count) += 1;
            ESP_LOGD("weather_debug", "Fetch failed (Code: %d), retrying in 5s... (Attempt %d/2)", http_code, current_retry + 1);
          } else {
            id(weather_retry_count) = 0;
            id(weather_desc) = http_code == 0 ? "NET" : to_string(http_code);
            id(weather_icon) = ")";
            id(weather_is_err) = true;
            ESP_LOGE("weather_debug", "Max retries reached. Waiting for next cycle.");
          }
      - if:
          condition:
            lambda: 'return id(weather_retry_count) > 0;'
          then:
            - delay: 5s
            - script.execute: fetch_weather

  - id: fetch_weather
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              // 检查 1~8 屏是否有任意一屏被设置为显示 Weather
              return id(page_1_content).current_option() == "Weather" ||
                     id(page_2_content).current_option() == "Weather" ||
                     id(page_3_content).current_option() == "Weather" ||
                     id(page_4_content).current_option() == "Weather" ||
                     id(page_5_content).current_option() == "Weather" ||
                     id(page_6_content).current_option() == "Weather" ||
                     id(page_7_content).current_option() == "Weather" ||
                     id(page_8_content).current_option() == "Weather";
          then:
            # 只有满足上述条件（有页面要显示天气），才执行以下网络抓取
            - http_request.get:
                url: !lambda |-
                  return ((std::string) "http://api.open-meteo.com/v1/forecast?latitude=" + 
                        to_string(id(weather_lat).state) + 
                        "&longitude=" + 
                        to_string(id(weather_lon).state) + 
                        "&current=temperature_2m,relative_humidity_2m,weather_code,is_day").c_str();
                capture_response: true
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: 'return response->status_code == 200;'
                        then:
                          - lambda: |-
                              json::parse_json(body, [](JsonObject root) -> bool {
                                if (root["current"].is<JsonObject>()) {
                                  float t = root["current"]["temperature_2m"];
                                  float h = root["current"]["relative_humidity_2m"];
                                  int code = root["current"]["weather_code"];
                                  int is_day = root["current"]["is_day"];
                                  ESP_LOGD("weather_debug", "JSON Parsed -> Temp: %.1f, Hum: %.0f, Code: %d, is_day: %d", t, h, code, is_day);
                                  
                                  std::string d = "Unknown";
                                  std::string i = ")";  // 默认未知图标
                                  
                                  switch(code) {
                                    case 0: d = "Clear"; i = (is_day == 1) ? "B" : "C"; break;  // B: 太阳 | C: 纯月亮
                                    case 1: case 2: case 3: d = "Cloudy"; i = (is_day == 1) ? "H" : "I"; break;  // H: 多云天(日) | I: 多云夜(月)
                                    case 45: case 48: d = "Foggy"; i = "M"; break;  // 雾/雾凇
                                    case 51: case 53: case 55: d = "Drizzle"; i = "Q"; break;  // 毛毛雨 (轻度/中度/密集)
                                    case 56: case 57: d = "Frz Driz"; i = "X"; break;  // 冻毛毛雨
                                    case 61: case 63: case 65: d = "Rainy"; i = "R"; break;  // 阵雨/常规雨 (小/中/大)
                                    case 66: case 67: d = "Frz Rain"; i = "X"; break;  // 冻雨
                                    case 71: case 73: case 75: d = "Snowy"; i = "W"; break;  // 降雪 (小/中/大)
                                    case 77: d = "Snow Grn"; i = "W"; break;  // 雪粒
                                    case 80: case 81: case 82: d = "Showers"; i = "R"; break;  // 阵雨 (弱/中/强) 
                                    case 85: case 86: d = "Snw Show"; i = "W"; break;  // 阵雪 (弱/强)
                                    case 95: case 96: case 99: d = "Stormy"; i = "O"; break;  // 雷暴/雷阵雨伴随冰雹
                                  }
                                  
                                  id(weather_temp) = t;
                                  id(weather_hum) = h;
                                  id(weather_desc) = d;
                                  id(weather_icon) = i;
                                  id(weather_retry_count) = 0; // 彻底成功后，将重试次数清零
                                  id(weather_is_err) = false;  // 天气获取成功时，解除错误状态
                                  ESP_LOGD("weather_debug", "UI variables updated successfully.");
                                }
                                return true;
                              });
                        else:
                          - script.execute:
                              id: handle_weather_error
                              http_code: !lambda 'return response->status_code;'
                on_error:
                  then:
                    - script.execute:
                        id: handle_weather_error
                        http_code: 0
          else:
            # 所有页面都没选天气时，打印一行日志并静默退出，不产生网络请求
            - logger.log: "Weather page is not selected on any screen. Skipping background fetch."

  # 天气动态轮询任务
  - id: weather_auto_poll_task
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            # 动态延时：读取前端设置的分钟数并转换为毫秒
            - delay: !lambda "return id(weather_refresh_interval).state * 60000;"
            
            # 时间到了之后，检查是否联网，联网则抓取
            - if:
                condition:
                  wifi.connected:
                then:
                  - script.execute: fetch_weather

  # PM 传感器动态轮询任务
  # 1. 硬件层：强开风扇/激光器
  - id: pm_hw_on
    then:
      - lambda: |-
          uint8_t data[7] = {0x16, 0x07, 0x05, 0x00, 0xB4, 0x00, 0x00};
          data[6] = data[0] ^ data[1] ^ data[2] ^ data[3] ^ data[4] ^ data[5];
          id(pm_i2c).write(0x28, data, 7);
          ESP_LOGI("PM_CTRL", "Hardware turned ON (Dynamic Mode)");

  # 2. 硬件层：强关风扇/激光器
  - id: pm_hw_off
    then:
      - lambda: |-
          uint8_t data[7] = {0x16, 0x07, 0x01, 0x00, 0xB4, 0x00, 0x00};
          data[6] = data[0] ^ data[1] ^ data[2] ^ data[3] ^ data[4] ^ data[5];
          id(pm_i2c).write(0x28, data, 7);
          ESP_LOGI("PM_CTRL", "Hardware turned OFF (Stop Mode)");

  # 3. 业务层：单次刷新任务
  - id: pm_single_script
    mode: restart
    then:
      - script.execute: pm_hw_on
      - delay: 120s
      - script.execute: pm_hw_off
      # 执行完毕后，自动将前端网页和 HA 的下拉菜单状态切回 "Off"
      - select.set:
          id: pm_control_mode
          option: "Off"

  # 4. 业务层：定时循环刷新任务
  - id: pm_interval_script
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - script.execute: pm_hw_on
            - delay: 120s
            - script.execute: pm_hw_off
            # 动态延时：读取用户设定的分钟数，转换为毫秒后减去已经消耗的120秒
            - delay: !lambda "return (id(pm_poll_interval).state * 60000) - 120000;"

font:
  - file: "FinlandicaHeadline-Regular.ttf"
    id: font_large    # PM2.5, CO2, TVOC, 温度, 湿度数值
    size: 35
  - file: "FinlandicaHeadline-Lining-Tabular-oled.ttf"
    id: font_medium   # 带秒数的时间
    size: 30
  - file: "FinlandicaHeadline-Regular.ttf"
    id: font_medium_w # 天气中的温度
    size: 28
  - file: "FinlandicaHeadline-Regular.ttf"
    id: font_medium_i # WiFi信号强度
    size: 22
  - file: "Roboto-Bold.ttf"
    id: font_medium_b # PM2.5,TVOC文字使用（加粗）
    size: 20
  - file: "FinlandicaHeadline-Lining-Tabular-oled.ttf"
    id: font_small    # 日期
    size: 17
  - file: "FinlandicaHeadline-Regular.ttf"
    id: font_small_i  # IP地址
    size: 14
  - file: "Roboto-Bold.ttf"
    id: font_small_b  # CO2文字使用（加粗）
    size: 17
  - file: "meteocons.ttf"
    id: font_icon     # 天气图标
    size: 40  
  - file: "materialdesignicons-webfont.ttf"
    id: font_mdi
    size: 40          # PM2.5, CO2, TVOC, 温度, 湿度
    glyphs:
      - "\U000F1799"  # PM2.5霾图标 (mdi-smog)
      - "\U000F07E4"  # CO2分子图标 (mdi-molecule-co2)
      - "\U000F0D43"  # TVOC气味图标 (mdi-scent)
      - "\U000F050F"  # 温度计图标 (mdi-thermometer)
      - "\U000F0E0A"  # 水滴湿度图标 (mdi-water)
      - "\U000F05A9"  # WiFi图标 (WiFi)

display:
  - platform: ssd1306_i2c
    model: ${display_model}
    i2c_id: hmi_i2c      
    address: ${display_address}  # 不亮可改为0x3D/0x3C
    id: oled_display
    update_interval: 33ms # 缩短刷新间隔以确保动画流畅 ( 50ms / 20 FPS; 33ms / 30 FPS)
    lambda: |-
      // 检测屏幕开关状态，关闭直接退出不运算，节省CPU
      if (!id(screen_switch).state) return;
      // 绘制模版: 动态接收页面ID和横向偏移量 offset
      auto draw_page = [&](int page_id, int offset) {
        switch(page_id) {
          case 0: // 页面1：时间显示
          // 显示日期，格式为：YYYY-MM-DD 周几 (例如: 2026-05-18 Mon)，显示秒数请改成("%H:%M:%S")，改为直接写入屏幕的strftime
            it.strftime(64 + offset, 5, id(font_small), TextAlign::TOP_CENTER, "%Y-%m-%d %a", id(my_time).now());
            it.strftime(64 + offset, 25, id(font_medium), TextAlign::TOP_CENTER, "%H:%M:%S", id(my_time).now());
            break;

          case 1: // 页面2：室外天气
            // 左侧：永远渲染天气图标 (正常图标或 N/A)
            it.printf(5 + offset, 12, id(font_icon), TextAlign::TOP_LEFT, "%s", id(weather_icon).c_str());
            
            if (id(weather_desc) == "Wait...") {
              // 1. 刚开机还没获取时的状态
              it.printf(128 + offset, 20, id(font_medium), TextAlign::TOP_RIGHT, "--");
            } 
            else if (id(weather_is_err)) {
              // 2. 报错状态：右上角显示 502 / -1 等错误码，右下角显示 ERR
              it.printf(128 + offset, 4, id(font_medium), TextAlign::TOP_RIGHT, "%s", id(weather_desc).c_str());
              it.printf(128 + offset, 38, id(font_small), TextAlign::TOP_RIGHT, "ERR");
            } 
            else {
              // 3. 正常状态：右上角显示温度，右下角显示湿度
              it.printf(128 + offset, 4, id(font_medium), TextAlign::TOP_RIGHT, "%.1fC", id(weather_temp));
              it.printf(128 + offset, 38, id(font_small), TextAlign::TOP_RIGHT, "%.0f%% RH", id(weather_hum));
            }
            // 未启用. 中间：天气英文描述
            // it.printf(45 + offset, 10, id(font_small), TextAlign::TOP_LEFT, "%s", id(weather_desc).c_str());
            
            break;

          case 2: // 页面3：温度
            it.printf(0 + offset, 13, id(font_mdi), TextAlign::TOP_LEFT, "\U000F050F");
            if (id(temp_val).has_state()) {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "%.1fC", id(temp_val).state);
            } else {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "--");
            }
            break;

          case 3: // 页面4：湿度
            it.printf(0 + offset, 13, id(font_mdi), TextAlign::TOP_LEFT, "\U000F0E0A");
            if (id(hum_val).has_state()) {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "%.0f%%", id(hum_val).state);
            } else {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "--");
            }
            break;

          case 4: // 页面5：PM2.5 (纯排版设计)
            // 巧用 TOP_CENTER：指定同一个 X 坐标 (20)，2.5 的小数点会自动和 PM 的中心绝对对齐
            it.printf(20 + offset, 10, id(font_medium_b), TextAlign::TOP_CENTER, "PM");
            it.printf(20 + offset, 30, id(font_medium_b), TextAlign::TOP_CENTER, "2.5");
            
            // 右侧大字数值保持不变
            if (id(pm25_val).has_state()) {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "%.0f", id(pm25_val).state);
            } else {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "--");
            }
            break;
          
          case 5: // 页面6：CO2 (精细下标设计)
            // 1. 先用中粗字体在上方渲染 "CO"
            it.printf(5 + offset, 16, id(font_medium_b), TextAlign::TOP_LEFT, "CO");
            
            // 2. 用小字体在右下角单独渲染 "2"
            // X 坐标设为 32 (5 + 27px 刚好避开 CO 的宽度)，Y 坐标设为 26 形成下沉效果
            it.printf(32 + offset, 26, id(font_small_b), TextAlign::TOP_LEFT, "2");

            if (id(co2_val).has_state()) {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "%.0f", id(co2_val).state);
            } else {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "--");
            }
            break;

          case 6: // 页面7：TVOC (纯排版设计)
            // 同样采用居中堆叠排版
            it.printf(20 + offset, 10, id(font_medium_b), TextAlign::TOP_CENTER, "TV");
            it.printf(20 + offset, 30, id(font_medium_b), TextAlign::TOP_CENTER, "OC");
            
            if (id(tvoc_val).has_state()) {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "%.0f", id(tvoc_val).state);
            } else {
              it.printf(128 + offset, 11, id(font_large), TextAlign::TOP_RIGHT, "--");
            }
            break;

          case 98: { // 页面99：WiFi 状态页
            // 1. 左侧：WiFi 图标或文字提示
            it.printf(0 + offset, 13, id(font_mdi), TextAlign::TOP_LEFT, "\U000F05A9");

            // 2. 右上方：显示信号强度 (不仅要求有状态，且信号值不能是默认的 0.0)
            if (id(wifi_rssi_val).has_state() && id(wifi_rssi_val).state != 0.0) {
              // 128代表屏幕最右侧，TextAlign::TOP_RIGHT 代表靠右对齐
              it.printf(128, 10, id(font_medium_i), TextAlign::TOP_RIGHT, "%.0f dBm", id(wifi_rssi_val).state);
            } else {
              it.print(128, 10, id(font_medium_i), TextAlign::TOP_RIGHT, "Wait...");
            }
            
            // 3. 右下方：显示分配到的 IP 地址 (不仅要求有状态，且不能是空或者 0.0.0.0)
            if (id(wifi_ip_str).has_state() && id(wifi_ip_str).state != "" && id(wifi_ip_str).state != "0.0.0.0") {
              it.print(128, 39, id(font_small_i), TextAlign::TOP_RIGHT, id(wifi_ip_str).state.c_str());
            } else {
              it.print(128, 39, id(font_small_i), TextAlign::TOP_RIGHT, "Get IP Add...");
            }
            break;
          }

          case 99: { // 页面100：设备信息与彩蛋页
            if (id(dino_click_count) >= 3) {
              // 当快速点击达到 3 次或 4 次时显示的动态彩蛋提示 UI
              it.printf(64 + offset, 5, id(font_medium_b), TextAlign::TOP_CENTER, "DINO?");
              it.printf(64 + offset, 35, id(font_small_i), TextAlign::TOP_CENTER, "%d / 5", id(dino_click_count));
            } else {
              // 正常按下时显示的设备信息 UI
              it.printf(64 + offset, 5, id(font_small), TextAlign::TOP_CENTER, "GPLv3 by Yamada");
              it.printf(64 + offset, 28, id(font_small_i), TextAlign::TOP_CENTER, "Ver: %s-%s", "${pm_sensor_type}", "${fw_version}");
              it.printf(64 + offset, 46, id(font_small_i), TextAlign::TOP_CENTER, "Long press to reset");
            }
            break;
          }

          case 555: {                     // 恐龙彩蛋游戏页面
            if (id(dino_state) == 1) {    // 游玩中
              // --- 1. 物理引擎与坐标 ---
              id(dino_v) += 0.6;          // 重力加速度
              id(dino_y) += id(dino_v);   // 应用速度到高度
              
              if (id(dino_y) >= 50.0) {   // 落地检测
                id(dino_y) = 50.0;
                id(dino_v) = 0.0;
              }
              
              // 仙人掌生成与移动
              float speed = 3.5 + (id(dino_score) * 0.15); // 随着得分增加，速度变快
              if (speed > 9.0) speed = 9.0;                // 速度封顶防穿模
              id(cactus_x) -= speed;
              id(cactus2_x) -= speed;
              
              // 当 1 号仙人掌移出屏幕，以最后方的仙人掌为基准追加距离
              if (id(cactus_x) < -20.0) { 
                float ref_x = (id(cactus2_x) > 128.0) ? id(cactus2_x) : 128.0;
                // 随机生成下一个障碍物出现的距离间隙
                id(cactus_x) = ref_x + 50.0 + (random_uint32() % 100);
                // 随机抽取 0~3 一共 4 种形态的障碍物
                id(obs_type) = random_uint32() % 4; 
                id(dino_score) += 1;
              }
              // 当 2 号仙人掌移出屏幕，同理交替生成
              if (id(cactus2_x) < -20.0) { 
                float ref_x = (id(cactus_x) > 128.0) ? id(cactus_x) : 128.0;
                id(cactus2_x) = ref_x + 50.0 + (random_uint32() % 100); 
                id(obs2_type) = random_uint32() % 4; 
                id(dino_score) += 1;
              }
              
              // --- 2. 动态碰撞检测 (使用 Lambda 函数简化重复代码) ---
              auto check_collision = [&](float c_x, int type) -> bool {
                int cx = (int)c_x;
                int dy = (int)id(dino_y);
                int dx_min = 10, dx_max = 18, dy_min = dy - 14, dy_max = dy; // 恐龙固定碰撞箱：X(10 到 18), Y(头dy-14 到 脚dy)
                int ox_min = cx, ox_max = cx, oy_min = 50, oy_max = 50;      // 障碍物的动态碰撞箱
                
                if (type == 0) { ox_max = cx + 6; oy_min = 38; }             // 单小 (宽6, 高12)
                else if (type == 1) { ox_max = cx + 14; oy_min = 38; }       // 双小 (宽14, 高12)
                else if (type == 2) { ox_max = cx + 8; oy_min = 32; }        // 单大 (宽8, 高18，需要跳得更准)
                else if (type == 3) { ox_max = cx + 18; oy_min = 38; }       // 三体宽型 (宽18, 高12，需要跳得较早)

                return ((dx_min < ox_max) && (dx_max > ox_min) && (dy_max > oy_min) && (dy_min < oy_max));
              };

              // 只要撞到 1 号或 2 号中的任意一个，立刻 Game Over
              if (check_collision(id(cactus_x), id(obs_type)) || check_collision(id(cactus2_x), id(obs2_type))) {
                id(dino_state) = 2; // Game Over
                if (id(dino_score) > id(dino_high_score)) {
                  id(dino_high_score) = id(dino_score); // 破纪录，存储新最高分
                }
                id(dino_game_over_script).execute();
              }
              
              // --- 3. 画面渲染 ---
              it.line(0, 50, 128, 50); // 地平线
              
              // 绘制小恐龙
              it.filled_rectangle(10, id(dino_y) - 10, 8, 10, COLOR_ON);  // 恐龙身体
              it.filled_rectangle(14, id(dino_y) - 14, 6, 6, COLOR_ON);   // 恐龙头
              it.filled_rectangle(16, id(dino_y) - 12, 2, 2, COLOR_OFF);  // 恐龙眼睛留白
              
              // 绘制障碍物的封装函数
              auto draw_obs = [&](float c_x, int type) {
                int cx = (int)c_x;
                if (type == 0) {         // 形态0：单个小仙人掌
                  it.filled_rectangle(cx, 38, 6, 12, COLOR_ON);
                  it.filled_rectangle(cx - 2, 42, 2, 4, COLOR_ON);
                  it.filled_rectangle(cx + 6, 40, 2, 4, COLOR_ON);
                } else if (type == 1) {  // 形态1：双体小仙人掌
                  it.filled_rectangle(cx, 38, 6, 12, COLOR_ON);
                  it.filled_rectangle(cx - 2, 42, 2, 4, COLOR_ON);
                  it.filled_rectangle(cx + 8, 38, 6, 12, COLOR_ON);
                  it.filled_rectangle(cx + 14, 40, 2, 4, COLOR_ON);
                } else if (type == 2) {  // 形态2：单个高仙人掌
                  it.filled_rectangle(cx, 32, 8, 18, COLOR_ON);
                  it.filled_rectangle(cx - 3, 38, 3, 6, COLOR_ON);
                  it.filled_rectangle(cx + 8, 36, 3, 6, COLOR_ON);
                } else if (type == 3) {  // 形态3：三体变种仙人掌
                  it.filled_rectangle(cx, 40, 6, 10, COLOR_ON);
                  it.filled_rectangle(cx + 6, 38, 6, 12, COLOR_ON);
                  it.filled_rectangle(cx + 12, 42, 6, 8, COLOR_ON);
                }
              };

              // 分别画出两个障碍物
              draw_obs(id(cactus_x), id(obs_type));
              draw_obs(id(cactus2_x), id(obs2_type));
              
              // 右上角实时分数
              it.printf(125, 0, id(font_small), TextAlign::TOP_RIGHT, "%d", id(dino_score));
              
            } else if (id(dino_state) == 2) { // 游戏结束画面
              it.printf(64, 5, id(font_medium_b), TextAlign::TOP_CENTER, "GAME OVER");
              it.printf(64, 30, id(font_small_i), TextAlign::TOP_CENTER, "Score: %d", id(dino_score));
              it.printf(64, 45, id(font_small_i), TextAlign::TOP_CENTER, "HI: %d", id(dino_high_score));
            }
            break;
          }

        }
      };

      if (id(is_animating)) {
        // 直接读取已经转为数字整型的全局变量，彻底移除每 33 毫秒发生一次的全局字符串拷贝
        int style = id(animation_style_idx); 

        if (style == 0) { // 如果用户选择了“无特效”，直接瞬间切换并结束
          id(current_page_id) = id(next_page_id);
          id(scroll_offset) = 0;
          id(is_animating) = false;
          draw_page(id(current_page_id), 0);
        } 
        else if (style == 1) { // 硬件级淡入淡出 + 纯黑暗场衔接
          // 读取用户设定的目标对比度
          float target_contrast = id(oled_brightness).state / 100.0;
          
          // 将 0~100 的动画进度精细划分为三个阶段：
          // 0  ~ 30 : 阶段一：当前页面淡出变暗
          // 30 ~ 70 : 阶段二：真·全黑留白期（暗场衔接）
          // 70 ~ 100: 阶段三：新一页面淡入点亮

          if (id(scroll_offset) <= 30) {
            // 比例从 1.0 线性降到 0.0
            float ratio = 1.0 - (id(scroll_offset) / 30.0);
            id(oled_display).set_contrast(target_contrast * ratio);
            draw_page(id(current_page_id), 0); // 绘制当前页
          } 
          else if (id(scroll_offset) > 30 && id(scroll_offset) < 70) {
            // 强制设置硬件对比度为最低
            id(oled_display).set_contrast(0.0);
            
            // 不调用 draw_page()，不绘制任何图形和文字
            // 此时整个显示缓冲区全为 COLOR_OFF，OLED 像素达成 0 发光
            
            // 在后台静默切换页面 ID，为接下来的淡入做准备
            id(current_page_id) = id(next_page_id);
          } 
          else {
            // 比例从 0.0 线性升到 1.0
            float ratio = (id(scroll_offset) - 70.0) / 30.0;
            id(oled_display).set_contrast(target_contrast * ratio);
            draw_page(id(current_page_id), 0); // 绘制新页面
          }

          // 每次刷新步进 6
          id(scroll_offset) += 6;

          // 动画结束
          if (id(scroll_offset) >= 100) {
            id(current_page_id) = id(next_page_id);
            id(scroll_offset) = 0;
            id(is_animating) = false;
            // 结束时强制将对比度精准恢复到用户设定的目标值
            id(oled_display).set_contrast(target_contrast);
          }
        }
        else {
          // 阶段一（进度 0% ~ 50%）：黑色幕布逐渐覆盖当前（旧）页面
          if (id(scroll_offset) <= 50) {
            draw_page(id(current_page_id), 0); // 绘制旧页面

            if (style == 2) { // Wipe Right to Left
              int w = (id(scroll_offset) * 128) / 50;
              it.filled_rectangle(128 - w, 0, w, 64, COLOR_OFF);
            } 
            else if (style == 3) { // Wipe Left to Right
              int w = (id(scroll_offset) * 128) / 50;
              it.filled_rectangle(0, 0, w, 64, COLOR_OFF);
            } 
            else if (style == 4) { // Wipe Top to Bottom
              int h = (id(scroll_offset) * 64) / 50;
              it.filled_rectangle(0, 0, 128, h, COLOR_OFF);
            } 
            else if (style == 5) { // Wipe Bottom to Top
              int h = (id(scroll_offset) * 64) / 50;
              it.filled_rectangle(0, 64 - h, 128, h, COLOR_OFF);
            } 
            else if (style == 6) { // Blinds Effect 屏幕等分成8个竖条，每个竖条宽16像素，同步变宽遮盖
              int w = (id(scroll_offset) * 16) / 50;
              for (int i = 0; i < 8; i++) {
                it.filled_rectangle(i * 16, 0, w, 64, COLOR_OFF);
              }
            }
          } 
          // 阶段二（进度 51% ~ 100%）：黑色幕布逐渐退去，漏出新页面
          else {
            draw_page(id(next_page_id), 0); // 绘制新页面

            if (style == 2) {
              int w = ((id(scroll_offset) - 50) * 128) / 50;
              it.filled_rectangle(0, 0, 128 - w, 64, COLOR_OFF);
            } 
            else if (style == 3) {
              int w = ((id(scroll_offset) - 50) * 128) / 50;
              it.filled_rectangle(w, 0, 128 - w, 64, COLOR_OFF);
            } 
            else if (style == 4) {
              int h = ((id(scroll_offset) - 50) * 64) / 50;
              it.filled_rectangle(0, h, 128, 64 - h, COLOR_OFF);
            } 
            else if (style == 5) {
              int h = ((id(scroll_offset) - 50) * 64) / 50;
              it.filled_rectangle(0, 0, 128, 64 - h, COLOR_OFF);
            } 
            else if (style == 6) {
              int w = ((id(scroll_offset) - 50) * 16) / 50;
              for (int i = 0; i < 8; i++) {
                it.filled_rectangle(i * 16 + w, 0, 16 - w, 64, COLOR_OFF);
              }
            }
          }

          // 每次刷新画面，进度前进 10%。(10帧完成动画，约耗时500ms)
          // 如果将其改为 += 5;：动画会变慢一倍，过渡更加平滑、细腻（耗时约 1 秒）。
          // 如果将其改为 += 20;：动画会变快一倍，瞬间完成擦除（耗时约 250 毫秒）。
          id(scroll_offset) += 10;

          // 动画播放结束，重置状态
          if (id(scroll_offset) >= 100) {
            id(current_page_id) = id(next_page_id);
            id(scroll_offset) = 0;
            id(is_animating) = false;
          }
        }
      } else {
        // 没有动画时，正常静止显示当前页面
        draw_page(id(current_page_id), 0);
      }