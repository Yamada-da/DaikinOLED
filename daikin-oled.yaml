  - platform: template
    internal: true
    id: pm25_alert_trigger
    lambda: |-
      return id(led_master).state && (id(pm25_val).state > id(pm25_alert_limit).state);
    on_press:
      then:
        - switch.turn_on: pm25_warn_led
    on_release:
      then:
        - switch.turn_off: pm25_warn_led
  - platform: template
    internal: true
    id: co2_auto_calibration
    lambda: |-
      return id(co2_val).state < 405;
    filters:
      - delayed_on: 15min
    on_press:
      then:
        - cm1106.calibrate_zero: cm1106_sensor
  - platform: gpio
    pin:
      number: 34
      inverted: true
    id: hw_reset_btn
    internal: true
    on_press:
      then:
        - lambda: |-
            if (id(dino_state) == 1) { 
              // 游戏中：接管按键为起跳
              if (id(dino_y) >= 50.0) { 
                id(dino_v) = -8.0; 
              }
            } else if (id(dino_state) == 2) {
              // 游戏结束画面：什么都不做，防止误增加按键次数 修复5/5不显示问题，添加状态拦截
            } else {
              // 非游戏中：累加连击次数
              id(dino_click_count) += 1;
              
              if (id(dino_click_count) == 1) {
                // 第一次按下：停止轮播、唤醒屏幕并切到设备信息页
                id(carousel_loop).stop();
                if (!id(screen_switch).state) {
                  id(screen_switch).turn_on();
                }
                id(next_page_id) = 99;
                id(is_animating) = true;
                
                // 启动长按重置计时器 (如果一直按住不放，3秒后重置)
                id(reset_hold_script).execute();
              } else {
                // 检测到第 2 次及以上的快速点击：立刻取消长按重置计时，防止误触发重置
                id(reset_hold_script).stop();
              }
              
              if (id(dino_click_count) >= 5) {
                // 满 5 次连击：进入彩蛋游戏
                // id(dino_click_count) = 0; // 修复5/5不显示问题
                id(click_timeout_script).stop();
                id(info_page_timeout_script).stop();
                id(reset_hold_script).stop();
                id(virtual_dino_button).press();
              } else {
                // 未满 5 次：刷新“连击超时”与“停留3秒返回”倒计时
                id(click_timeout_script).execute();
                id(info_page_timeout_script).execute();
              }
            }
    on_release:
      then:
        - lambda: |-
            if (id(dino_state) == 1) {
              // 游戏中：松开按键触发短跳
              if (id(dino_v) < -2.0) {
                id(dino_v) = -2.0; 
              }
            } else {
              // 非游戏中：松开按键时停掉长按重置计时（短按点按不会触发重置）
              id(reset_hold_script).stop();
            }


