time:
  - platform: sntp
    id: my_time
    timezone: "Asia/Shanghai" # 设置为中国时区
    update_interval: ${sntp_update_interval}
    # 定时检查逻辑
    on_time:
      - seconds: 0
        minutes: /1 # 每一分钟的第0秒触发检查
        then:
          - lambda: |-
              if (id(screen_schedule).state) { // 只有在前端打开了"定时开关"才执行
                auto time = id(my_time).now();
                if (time.is_valid()) { // 确保网络时间已经同步成功
                  int current_h = time.hour;
                  int current_m = time.minute;
                  
                  // 判断是否到达关屏时间
                  if (current_h == id(screen_off_hour).state && current_m == id(screen_off_min).state) {
                    if (id(screen_switch).state) { // 如果屏幕是亮的，就关掉
                      id(screen_switch).turn_off();
                    }
                  }
                  // 判断是否到达开屏时间
                  else if (current_h == id(screen_on_hour).state && current_m == id(screen_on_min).state) {
                    if (!id(screen_switch).state) { // 如果屏幕是关的，就打开
                      id(screen_switch).turn_on();
                    }
                  }
                }
              }

script:
  # 长按 3 秒重置
  - id: reset_hold_script
    mode: restart
    then:
      - delay: 3s
      - button.press: factory_reset_btn

  # 设备信息/提示界面停留 3 秒后返回轮播
  - id: info_page_timeout_script
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: 'return id(dino_state) == 0;' # 仅在非游戏状态下才退回轮播
          then:
            - lambda: |-
                id(dino_click_count) = 0;
                id(next_page_id) = 0;
                id(is_animating) = true;
            - script.execute: carousel_loop

  # 连击间隔超时 (1秒未按则重置计数)
  - id: click_timeout_script
    mode: restart
    then:
      - delay: 1s
      - lambda: |-
          if (id(dino_state) == 0 && id(dino_click_count) < 5) {
            id(dino_click_count) = 0;
          }

  # 用于2秒内没按满5次，清零按键计数器
  - id: reset_click_count_script
    mode: restart
    then:
      - delay: 2s
      - lambda: 'id(dino_click_count) = 0;'

  # 撞到障碍物后的结束流程 (停留5秒后退出)
  - id: dino_game_over_script
    then:
      - delay: 5s
      - lambda: |-
          id(dino_state) = 0;         // 彻底退出游戏状态
          id(dino_click_count) = 0;   // 添加清零，确保下次游玩从 0 开始计数，用于修复5/5不显示
          id(next_page_id) = 0;       // 准备退回第一页 (时间页)
          id(is_animating) = true;
      - script.execute: carousel_loop # 重新启动轮播

  - id: carousel_loop
    then:
      - while:
          condition:
            lambda: 'return true;' # 无限循环
          then:
            # 增加一个极短的基础延时，防止用户把 7 个屏幕全选为 "Skip" 时，
            # while死循环没有延时从而触发 ESP32 看门狗重启机制 (Watchdog Reset)
            - delay: 100ms 

            # ================= 第 1 屏 =================
            - if:
                condition:
                  lambda: 'return id(page_1_content).current_option() != "Skip";'
                then:
                  - lambda: |-
                      std::string s = id(page_1_content).current_option();
                      if (s == "Time") id(next_page_id) = 0;
                      else if (s == "Weather") id(next_page_id) = 1;
                      else if (s == "Temperature") id(next_page_id) = 2;
                      else if (s == "Humidity") id(next_page_id) = 3;
                      else if (s == "PM2.5") id(next_page_id) = 4;
                      else if (s == "CO2") id(next_page_id) = 5;
                      else if (s == "TVOC") id(next_page_id) = 6;
                      else if (s == "WiFi") id(next_page_id) = 98;
                      // 只有当即将显示的页面不同于当前页面时，才触发动画
                      if (id(current_page_id) != id(next_page_id)) id(is_animating) = true;
                  - delay: !lambda 'return id(page_1_duration).state * 1000;'

            # ================= 第 2 屏 =================
            - if:
                condition:
                  lambda: 'return id(page_2_content).current_option() != "Skip";'
